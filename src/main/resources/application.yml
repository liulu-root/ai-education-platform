spring:
  application:
    name: ai-education-platform
  datasource:
    url: jdbc:h2:file:./data/edu-ai;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null

server:
  port: 8080
  shutdown: graceful
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: strict
        secure: ${SESSION_COOKIE_SECURE:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}

edu:
  ai:
    provider: ${EDU_AI_PROVIDER:mock}
    base-url: ${AI_BASE_URL:https://api.openai.com}
    api-key: ${AI_API_KEY:}
    chat-model: ${AI_CHAT_MODEL:gpt-4.1-mini}
    temperature: 0.2
    timeout-seconds: 45
    monthly-token-budget: 1000000
    store-prompt-preview: true
    prompt-preview-length: 240
    context:
      context-window-tokens: ${AI_CONTEXT_WINDOW_TOKENS:16384}
      max-output-tokens: ${AI_MAX_OUTPUT_TOKENS:2048}
      safety-margin-ratio: 0.10
      summary-max-tokens: 800
      recent-turns-to-keep: 2
      max-overflow-retries: 1
      retry-input-ratio: 0.75
      request-timeout-seconds: 60
      summary-timeout-seconds: 15
  vector:
    provider: ${VECTOR_STORE:in-memory}
    dimensions: 128
    embedding-provider: ${EMBEDDING_PROVIDER:local-hash}
    embedding-model: ${EMBEDDING_MODEL:text-embedding-3-small}
    milvus:
      base-url: ${MILVUS_BASE_URL:http://localhost:19530}
      token: ${MILVUS_TOKEN:root:Milvus}
      database: default
      collection: education_knowledge_chunks

logging:
  level:
    root: INFO
    com.xiaomi.education: INFO
